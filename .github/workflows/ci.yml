name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menezesgestao_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TESTE: postgres://postgres:postgres@localhost:5432/menezesgestao_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Cliente do PostgreSQL 16 (teste de backup e restauração)
        run: pg_dump --version | grep -q " 16\." || (sudo apt-get update && sudo apt-get install -y postgresql-client-16)
      - name: Dependências sem vulnerabilidade alta
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Ponta a ponta (celular 360 px e computador)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
